<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Pile</title>
    <link id="light-theme" rel="stylesheet" href="styles_light.css">
    <link id="dark-theme" rel="stylesheet" href="styles_dark.css" disable>
  </head>
  <body>
    <div id="app-container">
      <header id="top-header">
        <div class="header-text">
          <div class="title-group">
            <h1>Prompt Pile</h1>
            <p class="subtitle">by Abel Habte</p>
          </div>

          <button id="theme-toggle" class="icon-btn">
            <img
              id="theme-icon"
              src="../icons/circle_black.png"
              width="50"
              height="50"
              alt="Toggle Theme"
              class="app-logo"
            />
          </button>
        </div>
      </header>

      <br />

      <section id="control-area">
        <div id="action-row">
          <table border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
              <td width="20%">
                <button id="add-folder-btn" class="secondary-btn">
                  + Folder
                </button>
              </td>
              <td>
                <div class="search-container">
                  <input
                    type="text"
                    id="search-prompts"
                    placeholder="Search..."
                  />
                </div>
              </td>
            </tr>
          </table>
        </div>
      </section>

      <main id="main-list-view">
        <ul id="combined-list"></ul>
      </main>

      <footer id="footer-actions">
        <div class="footer-button-container">
          <button id="export-btn" class="secondary-btn">⬇️ Export</button>
          <button id="import-btn" class="secondary-btn">⬆️ Import</button>
        </div>
      </footer>
    </div>

    <dialog id="folder-modal">
      <h3>Create New Folder</h3>
      <form id="folder-form">
        <label for="folder-name">Folder Name:</label>
        <input type="text" id="folder-name" required />
        <div class="form-actions">
          <button type="button" id="cancel-folder-btn">Cancel</button>
          <button type="submit" class="primary-btn">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="prompt-modal">
      <h3>Create New Prompt</h3>
      <form id="prompt-form">
        <label for="prompt-title">Title:</label>
        <input type="text" id="prompt-title" required />
        <label for="prompt-folder">Folder:</label>
        <select id="prompt-folder">
          <option value="0">Uncategorized</option>
        </select>
        <label for="prompt-body">Prompt Text:</label>
        <textarea id="prompt-body" rows="6" required></textarea>
        <div class="form-actions">
          <button type="button" id="cancel-prompt-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Prompt</button>
        </div>
      </form>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
